apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

// Computed once at the top level so both the android block and generateBuildManifest can use them.
def gitHash = "unknown"
try {
    gitHash = 'git rev-parse --short HEAD'.execute([], project.rootDir).text.trim()
} catch (ignored) { }
def buildTime = new Date().format("yyyy-MM-dd'T'HH:mm:ss")

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    buildFeatures {
        buildConfig = true
    }

    // Traceability: stamp git hash + build time into BuildConfig so every JSON snapshot
    // (util/Persistence.java, hardware/BuildInfo.java) points back to exact source (CLAUDE.md §7, §12).
    defaultConfig {
        buildConfigField "String", "GIT_HASH", "\"${gitHash}\""
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
    }

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// Build-time manifest — generated on every build (hot-reload or full install) so you always have
// a local record of what was deployed without needing the robot or ADB.
// Output: build-manifest.json at the repo root. Open it in any editor; grep it from Terminal.
// Hardware names are scanned from source automatically — no manual list to maintain.
// TuningConfig defaults are parsed from source so the file reflects the code, not a stale copy.
task generateBuildManifest {
    def outputFile  = file("${rootDir}/build-manifest.json")
    def srcDir      = file("${projectDir}/src/main/java/org/firstinspires/ftc/teamcode")
    def tuningSource = file("${srcDir}/config/TuningConfig.java")

    inputs.dir  srcDir
    outputs.file outputFile

    doLast {
        // --- Hardware: scan all .java files for RC config name strings ---
        // Patterns covered:
        //   new MotorEx(hardwareMap, "LF_Motor")       — subsystem constructors
        //   .hardwareMapName("pinpoint")               — Pedro builder
        //   hardwareMap.get(DcMotorEx.class, "name")  — direct get with type
        //   hardwareMap.get("name")                    — direct get without type
        def hardware = new TreeSet<String>()
        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.java')) return
            f.eachLine { line ->
                def code = line.replaceAll('//.*', '') // strip line comments
                [
                    (code =~ /\w+\(hardwareMap,\s*"([^"]+)"/),          // ctor(hardwareMap, "name")
                    (code =~ /\.hardwareMapName\("([^"]+)"\)/),          // .hardwareMapName("name")
                    (code =~ /hardwareMap\.get\([^"]*"([^"]+)"/),        // hardwareMap.get(..., "name")
                ].each { m -> if (m) hardware << m[0][1] }
            }
        }

        // --- TuningConfig: parse default values for every public static field ---
        def tuning = [:]
        tuningSource.eachLine { line ->
            def m = (line =~ /public static (?:double|boolean|long|int) (\w+)\s*=\s*([^;\/]+)/)
            if (m) {
                def name = m[0][1].trim()
                def raw  = m[0][2].trim()
                if (raw == 'true' || raw == 'false') {
                    tuning[name] = (raw == 'true')
                } else if (raw.endsWith('L') || raw.endsWith('l')) {
                    try { tuning[name] = raw[0..-2].toLong() } catch (ignored) { tuning[name] = raw }
                } else {
                    try { tuning[name] = raw.toDouble() } catch (ignored) { tuning[name] = raw }
                }
            }
        }

        def manifest = [
            gitHash  : gitHash,
            buildTime: buildTime,
            hardware : hardware.toList(),
            tuning   : tuning,
        ]

        outputFile.text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(manifest))
        logger.lifecycle("Build manifest → ${outputFile}")
    }
}

preBuild.dependsOn generateBuildManifest

repositories {
    maven {
        url = 'https://maven.brott.dev/'
    }

    maven {
        url = 'https://mymaven.bylazar.com/releases'
    }

    maven {
        url "https://repo.dairy.foundation/releases"
    }

    maven {
        url "https://repo.dairy.foundation/snapshots"
    }
}

dependencies {
    implementation project(':FtcRobotController')
    annotationProcessor files('lib/OpModeAnnotationProcessor.jar')

    // SolversLib: Latest Stable Version

    // 0.3.6 satisfies both moves at once: it is the Pedro 3 line (its pedroPathing module depends
    // on com.pedropathing:revhub), and it carries no FTC SDK pin, so it resolves against SDK 12.
    // 0.3.4 was the blocker on both counts — its Gradle metadata pinned the SDK to STRICTLY 11.1.0.
    implementation "org.solverslib:core:0.3.6" // core
    implementation "org.solverslib:pedroPathing:0.3.6" // pedroPathing
    //    implementation "org.solverslib:photon:0.3.6" // photon is optional (see docs for more info)

    // FTC Dashboard REMOVED 2026-09-23. It and Panels each start their own Limelight forwarder, and
    // they want the same ports (5800/5801/5805/5807). Whichever starts second threw
    // java.net.BindException: Address already in use out of NanoHTTPD, which is fatal - the RC app
    // died about 30 seconds after every start and the robot never became usable. Panels already
    // ships a Limelight proxy (CLAUDE.md §2), so the dashboard was duplicating it.
    // Removing the `dashboard` artifact takes only the servers: FtcDashboard and
    // limelight/HttpForwarder live there, while `slothboard:core` - which fullpanels depends on and
    // still resolves - holds DashboardCore and config classes and NO server. Our teamcode never
    // referenced com.acmerobotics at all. If you put this back, expect the port clash to return.
    // implementation "com.acmerobotics.slothboard:dashboard:0.3.2+0.6.0"
    implementation "dev.frozenmilk.sinister:Sloth:0.3.2" // Sloth hot-reload runtime

    // Pedro Pathing 3. The ARTIFACT NAMES changed in 3.0.0, they are not a version bump:
    //   com.pedropathing:ftc       -> com.pedropathing:revhub   (the REV hub bindings)
    //   com.pedropathing:telemetry -> com.pedropathing:tuning    (AutoTune - see the warning below)
    // Pedro 3 publishes to Maven Central, which the root build.gradle already declares.
    // SolversLib 0.3.6 above is REQUIRED with it: its pedroPathing module depends on
    // com.pedropathing:revhub:3.0.0, and 0.3.5 and older are built against Pedro 2.x.
    implementation 'com.pedropathing:revhub:3.0.1'

    // WARNING - com.pedropathing:tuning is BACK ON at Aaron's direction, 2026-09-23, to re-measure
    // the boot behaviour. It is expected to break startup. Read this before changing it again:
    // AutoTune's TunerScanner.getTargets() returns `new NarrowSearch()` on EVERY call instead of
    // caching it in a field. Sinister calls getTargets() once per class it scans, so each call
    // rebuilds the whole exclusion list with String.split(). With SDK 12 + Pedro 3 + SolversLib
    // + Panels the class count got big enough that this one scanner ran for 15+ seconds on the
    // boot scan. The RC app never finished onCreate, the hub watchdog relaunched it after 10
    // seconds, and the robot sat in a restart loop showing NO OpModes on the Driver Station.
    // Proven on the comp robot 2026-09-23 from the hub's own ANR trace: 12 of 13 scanner threads
    // idle, one pinned in TunerScanner.getTargets. Versions 1.0.0 and 1.0.1 are byte-identical
    // (same SHA-1), so there is no version to fall back to. Removing it costs us AutoTune, which
    // means Pedro path tuning has no procedure to run - see CHANGELOG 2026-09-23.
    implementation 'com.pedropathing:tuning:1.0.0'

    // Panels Dashboard (Sloth fork). Version reads <sloth build>+<panels version>, same scheme as
    // the dashboard line above. MUST stay the Sloth fork: stock Panels finds tunables by scanning
    // the installed APK and resolving them with Class.forName, which returns ITS copy of a class,
    // not the copy Sloth is running. Every dashboard edit then lands in a class no OpMode reads,
    // silently. This fork is a Sinister scanner instead — Sloth hands it the classes and loader it
    // actually loaded — so there is only ever one copy. Measured 2026-08-30; see CHANGELOG.
    implementation "com.bylazar.sloth:fullpanels:0.3.2+1.0.13"

    // Off-robot unit tests (CLAUDE.md §9) — test-only, does not affect the APK
    testImplementation "junit:junit:4.13.2"
}
